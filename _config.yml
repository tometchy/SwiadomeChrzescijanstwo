title: Świadome Chrześcijaństwo
description: Celem naszym jest zaspokoić duchowe potrzeby braci i sióstr z różnych
  społeczności ewangelicznych w naszym kraju poprzez przybliżenie twórczości klasyków
  chrześcijańskiej duchowości.
url: https://tometchy.github.io
baseurl: /SwiadomeChrzescijanstwo
lang: pl
timezone: Europe/Warsaw
markdown: kramdown
permalink: pretty
exclude:
- _large_parts
- archiwum
- README.md
- Gemfile
- Gemfile.lock
- scripts
- vendor
- node_modules
- '*.sh'
- '*.py'
- requirements-import.txt
- migration-report.json
- redirects.csv
- tests
- _source_archive
- COVER_SOURCES.md
- AUDYT_PIERWSZA_WERSJA.md
- AUDYT.md
- MERGE_NOTES.md
- DEPLOY_CHECKLIST.md
- MERGE_DATA.json
- AUDYT_1DO1.md
- STRICT_AUDIT.json
- _data/catalog_web_snapshot.json
- .migration
- DEPLOY_GITHUB_PAGES.md
- .github
plugins:
- jekyll-seo-tag
- jekyll-sitemap
- jekyll-feed
collections:
  ksiazki:
    output: true
    permalink: /ksiazki/:name/
  artykuly:
    output: true
    permalink: /czytelnia/:name/
  broszury:
    output: true
    permalink: /broszury/:name/
  legacy_pages:
    output: true
    permalink: /archiwum/:name/
defaults:
- scope:
    path: ''
    type: ksiazki
  values:
    layout: book
- scope:
    path: ''
    type: artykuly
  values:
    layout: article
- scope:
    path: ''
    type: broszury
  values:
    layout: book
- scope:
    path: ''
  values:
    layout: default
feed:
  collections:
    artykuly:
      path: /feed.xml
