name: Generate real front-cover images

on:
  push:
    branches:
      - master
      - 'fix/**'
      - 'feature/**'
    paths:
      - 'assets/img/books/*.webp'
      - 'scripts/generate_book_fronts.py'
      - 'scripts/fetch_verified_cover_photos.py'
      - 'scripts/verified_cover_sources.yml'
      - 'scripts/make_favicon.py'
      - '.github/workflows/generate-book-fronts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fronts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processor
        run: python -m pip install 'Pillow>=10,<13' 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5' 'PyYAML>=6,<7'
      - name: Fetch confirmed original-edition cover photos
        run: python scripts/fetch_verified_cover_photos.py
      - name: Generate front panels from original local images
        run: python scripts/generate_book_fronts.py
      - name: Convert original favicon to gray transparent version
        run: python scripts/make_favicon.py
      - name: Commit produced images to the same branch
        shell: bash
        run: |
          git add _ksiazki/ assets/img/books/ assets/img/favicon-gray-transparent.png
          if git diff --cached --quiet; then
            echo 'No new or modified cropped covers.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: archive verified cover photographs and regenerate fronts'
          git push origin "HEAD:${GITHUB_REF_NAME}"
