name: Publish Jekyll to GitHub Pages

on:
  push:
    branches: [master]
  workflow_run:
    workflows: ['Jednorazowa migracja treści swch.pl i wswch.pl']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest default branch, including migration commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Do not publish an unimported version
        shell: bash
        run: |
          if [ ! -f migration-report.json ]; then
            echo 'Migration report missing: wait for the content migration workflow.'
            exit 1
          fi
      - name: Verify 1:1 gate before deployment
        run: |
          python3 -m pip install beautifulsoup4 PyYAML
          python3 scripts/strict_audit.py --require-import
      - name: Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Restore large TNP and archival downloads from tracked binary chunks
        run: python3 scripts/rebuild_large_assets.py --output _site
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
