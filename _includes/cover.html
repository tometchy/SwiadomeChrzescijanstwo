{%- assign item = include.item -%}
<div class="book-cover cover-{{ item.cover_mode | default: 'graphic' }} theme-{{ item.category | slugify }}" aria-hidden="true">
  <div class="book-cover-typography"><span class="mini-emblem">✦</span><small>{{ item.author }}</small><strong>{{ item.title }}</strong><span class="publisher-mark">ŚWIADOME CHRZEŚCIJAŃSTWO</span></div>
  {%- if item.cover_url and item.cover_url != '' -%}
  <img src="{{ item.cover_url }}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">
  {%- endif -%}
</div>
