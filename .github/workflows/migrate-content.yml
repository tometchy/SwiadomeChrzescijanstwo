name: Jednorazowa migracja treści swch.pl i wswch.pl

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Bootstrap Jekyll source bundle']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: content-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check whether the first import is already committed
        id: status
        shell: bash
        run: |
          if [[ -f migration-report.json ]] && python3 -c "import json;assert json.load(open('migration-report.json'))['status']=='VERIFIED'" && [[ "${{ github.event_name }}" != 'workflow_dispatch' ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo 'Import jest już zapisany; zwykły push nie pobiera całej czytelni ponownie.'
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.status.outputs.skip == 'false'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-import.txt
      - name: Install migration tools
        if: steps.status.outputs.skip == 'false'
        run: python -m pip install -r requirements-import.txt pytest
      - name: Test migration engine
        if: steps.status.outputs.skip == 'false'
        run: python -m pytest -q tests/
      - name: Import accessible original articles and assets
        if: steps.status.outputs.skip == 'false'
        run: |
          python scripts/migrate_all.py --max-pages 6000 --max-assets 5000 --max-total-mb 1400 --delay 0.3 --overwrite --fail-on-errors
      - name: Verify strict textual and raw HTML integrity
        if: steps.status.outputs.skip == 'false'
        run: python scripts/strict_audit.py --require-import
      - name: Cache available Polish cover photos
        if: steps.status.outputs.skip == 'false'
        run: python scripts/cache_covers.py
      - name: Validate site content
        if: steps.status.outputs.skip == 'false'
        run: python scripts/validate_site.py
      - name: Commit imported content and images
        if: steps.status.outputs.skip == 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if [ -d assets/img/books ]; then git add -A -- assets/img/books; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Import real legacy articles, documents and book covers'
            git push
          fi
      - name: Summarize import completeness
        if: always() && steps.status.outputs.skip == 'false'
        shell: bash
        run: |
          if [ -f migration-report.json ]; then
            python - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path('migration-report.json').read_text())
          s=d['summary']
          print(json.dumps(s, ensure_ascii=False, indent=2))
          if s.get('errors',0):
              print('WARNING: The original sites have missing or non-importable resources. Review migration-report.json before DNS cutover.')
          PY
          fi

      - name: Upload migration audit if import fails
        if: always() && steps.status.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: migration-audit
          path: |
            migration-report.json
            STRICT_AUDIT.json
          if-no-files-found: warn
