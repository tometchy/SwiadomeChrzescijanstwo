name: CI — tests and Jekyll build
on:
  push:
    branches: [master]
    paths-ignore:
      - 'assets/legacy/**'
      - 'archiwum/swch/**'
      - 'archiwum/wswch/**'
      - '_source_archive/**'
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-import.txt
      - run: python -m pip install -r requirements-import.txt pytest
      - name: Testy importera i katalogów
        run: |
          python -m pytest -q tests/
          python scripts/validate_site.py
          python scripts/strict_audit.py
          if [ -f migration-report.json ]; then python scripts/verify_reachable.py; fi
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Budowanie statycznego Jekylla (bez publikacji)
        run: bundle exec jekyll build --trace
      - name: Downloadable site preview (not a published website)
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-preview
          path: _site/
          retention-days: 14
