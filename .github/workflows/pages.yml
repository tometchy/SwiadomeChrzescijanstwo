name: Publish Jekyll to GitHub Pages

on:
  push:
    branches: [master]
  workflow_run:
    workflows: ['Jednorazowa migracja treści swch.pl i wswch.pl']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest default branch, including migration commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Do not publish an unimported version
        shell: bash
        run: |
          if [ ! -f migration-report.json ]; then
            echo 'Migration report missing: wait for the content migration workflow.'
            exit 1
          fi
      - name: Verify exact captured sources before GitHub Pages preview
        run: |
          python3 -m pip install --disable-pip-version-check beautifulsoup4 PyYAML Pillow
          python3 scripts/strict_audit.py
          python3 scripts/verify_reachable.py
          echo 'This GitHub Pages preview contains all verified captured material. Previously dead links remain recorded in migration-report.json.' >> "$GITHUB_STEP_SUMMARY"
      - name: Generate authentic cropped book covers
        run: python3 scripts/generate_book_fronts.py
      - name: Convert original favicon to gray transparent PNG
        run: python3 scripts/make_favicon.py
      - name: Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Generate EPUB from Jekyll-rendered songs
        run: python3 scripts/build_hymnal_epub.py --site _site
      - name: Restore exact archived HTML and assets outside Jekyll template processing
        run: |
          # Jekyll renders archiwum/index.html as the navigation page.
          # Only exact source mirrors bypass Jekyll to preserve original bytes.
          for source in swch wswch; do
            if [ -d "archiwum/$source" ]; then
              mkdir -p "_site/archiwum/$source"
              cp -a "archiwum/$source/." "_site/archiwum/$source/"
            fi
          done
          python3 scripts/rebuild_large_assets.py --output _site
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Verify Pages artifact is visible to GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length' || echo 0)
            if [ "$count" = "1" ]; then
              echo 'One published artifact is now visible to GitHub API.'
              exit 0
            fi
            if [ "$count" != "0" ]; then
              echo "::error::Expected one github-pages artifact, got $count"
              exit 1
            fi
            sleep 5
          done
          echo "::error::Uploaded github-pages artifact was not queryable after retries"
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
