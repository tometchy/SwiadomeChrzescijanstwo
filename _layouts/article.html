<div class="page-top"><div class="container"><div class="crumbs"><a href="{{ '/' | relative_url }}">Strona główna</a><span>/</span><a href="{{ '/czytelnia/' | relative_url }}">Czytelnia</a><span>/</span>{{ page.title }}</div></div></div>

<section class="article-section"><div class="container article-container"><article class="prose">{{ content }}</article><div class="article-back"><a href="{{ '/czytelnia/' | relative_url }}">← Wróć do czytelni</a></div></div></section>
