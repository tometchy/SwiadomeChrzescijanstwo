swch_about: 'Podejmując się redagowania tego serwisu, pragniemy zaspokoić duchowe potrzeby naszych braci i sióstr z różnych społeczności ewangelicznych poprzez przybliżenie twórczości klasyków literatury chrześcijańskiej oraz niektórych współczesnych autorów. Zasady duchowego życia ukazane w Biblii, a praktykowane i nauczane przez Bożych mężów są niezmienne i zawsze aktualne.


  Społeczności, którym przewodzili owi mężowie, wydały godne owoce Ducha Świętego oraz zapisały się w historii Kościoła i cywilizacji chlubnymi zgłoskami. Ponadto klasyczne dzieła wybitnych autorów chrześcijańskich nigdy się nie starzeją, a właściwie stosowane, przydatne są do nauczania i wychowania następnych pokoleń.


  Dzieła znanych pasterzy i teologów ostatnich wieków, zalicza się do najwspanialszych przykładów literatury chrześcijańskiej i stanowią one obfite i niezrównane dziedzictwo Kościoła powszechnego. Wierzymy, że literatura ta, wypływająca z głębokiej pobożności i poznania Boga, pomoże wierzącym w duchowym wzroście i w świadomym chrześcijaństwie.


  Kierując się tym, przedstawiamy szerszemu gronu czytelników, często nieznane lub zapomniane dzieła pisarzy chrześcijańskich, dzieląc się tym co dla nas samych, przez ich usługę w sensie duchowym, okazało się pomocne i pożyteczne. Towarzyszy nam również pragnienie niesienia pomocy innym przez wskazanie DROGI, która w PRAWDZIE prowadzi nas do ŻYCIA, ku chwale i wywyższeniu Boga Ojca w Jezusie Chrystusie.


  Autorzy serwisu skupieni są w kilku zborach ewangelicznych, które to, od ponad dwudziestu lat utrzymują społeczność w ramach corocznych obozów biblijnych oraz dwudniowych konferencji w trakcie roku kalendarzowego. Formalna strona działalności społeczności realizowana jest w ramach „Fundacji Świadome Chrześcijaństwo”, którego celem jest również propagowanie treści serwisu w formie drukowanej. W tym miejscu dostępny jest aktualny katalog wydawniczy.'
wswch_intro: 'Celem naszym jest zaspokoić duchowe potrzeby braci i sióstr z różnych społeczności ewangelicznych w naszym kraju poprzez przybliżenie twórczości klasyków chrześcijańskiej duchowości.


  Zasady życia duchowego objawione w Biblii oraz praktykowane i nauczane przez Bożych pasterzy są niezmienne i zawsze aktualne. Społeczności, którymi kierowali owi pasterze, wydały godne owoce Ducha Świętego i zapisały się w historii Kościoła oraz cywilizacji chlubnymi zgłoskami. Ponadto klasyczne dzieła wybitnych autorów chrześcijańskich nigdy się nie starzeją i przy zachowaniu odpowiedniej proporcji przydatne są do nauczania i wychowania następnych pokoleń.


  Dzieła pastorów i teologów XVI, XVII i XVIII wieku zalicza się do najwspanialszych przykładów literatury chrześcijańskiej, stanowiąc obfite i niezrównane dziedzictwo Kościoła powszechnego.


  Towarzyszy nam pragnienie powrotu do szlachetnie jaśniejących pewników i pierwotnej prostoty wieku apostolskiego, w którym połączenie ludzkiej słabości i mocy duchowej pochodzącej od Boga dawało prawdziwy i przekonujący obraz biblijnego chrześcijaństwa.'
